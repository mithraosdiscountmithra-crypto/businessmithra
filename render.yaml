services:
  - type: web
    name: businessmithra
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd web && npm install --include=dev && npm run build && cd ../server && npm install --include=dev && npx prisma db push --skip-generate --accept-data-loss
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
